name: Release @studiopod/design

# ─────────────────────────────────────────────────────────────────────────────
# DS-0.6 — release pipeline for @studiopod/design (renamed from
# @studiopod/design-system in DS-7.3a; see docs/DS-7.3a-Package-Rename.md).
#
# REGISTRY: GitHub Packages (https://npm.pkg.github.com). PRIVATE.
# The package must never reach npmjs. `private: true` was removed in Phase D, so
# the guard is now package.json#publishConfig.registry, which overrides npm's
# default registry.npmjs.org. Verified, not assumed —
# `npm publish --dry-run --loglevel=verbose` reports:
#   npm notice Publishing to https://npm.pkg.github.com with tag latest
# This workflow's `registry-url` + scope pin the same target independently.
#
# SCOPE (cross-owner, by design): the repo is jheavner95/studiopod-design (a
# User — kept public so it deploys on Vercel's free plan) while the package is
# @studiopod (the studiopod org). These owners INTENTIONALLY differ. GitHub
# Packages ties GITHUB_TOKEN's write to the repo owner, so GITHUB_TOKEN cannot
# publish @studiopod from this repo — which is precisely why publishing uses a
# PAT (secrets.DS_NPM_TOKEN) owned by a studiopod-org member with write:packages.
# That PAT crosses the owner boundary; it is what published 0.1.1. (An earlier
# note here claimed the repo "must" live under the org — that was wrong;
# corrected in the DS-5G revised release recovery.)
#
# Releasing requires:
#   vars.DS_REGISTRY     repository variable = https://npm.pkg.github.com
#   secrets.DS_NPM_TOKEN classic PAT (write:packages), owned by a studiopod-org
#                        member. It reaches ONLY the publish step (below).
# Publish auth is a PAT, NOT GITHUB_TOKEN — deliberately. The repo is
# jheavner95/studiopod-design (User; public for Vercel's free plan) while the
# package is @studiopod (org). GITHUB_TOKEN is scoped to the repo owner and
# cannot publish across that boundary; a studiopod-member PAT can (it published
# 0.1.1). The dry-run and publish jobs FAIL (not skip) when DS_REGISTRY is
# missing; a missing/invalid DS_NPM_TOKEN surfaces as a publish-step npm error.
# An earlier revision skipped instead: an operator who asked for a release would
# have got a green run that published nothing. Silence is the worst outcome for
# an explicit request, so it is an error now.
#
# CI-2 — trigger corrected. This workflow used to ALSO run its `fast` and
# `verify` jobs on every push to main and every pull request — two hosted
# runners, each with its own checkout/Node-setup/`npm ci`, on every commit.
# That routine half is now .github/workflows/validate.yml (one runner, no
# release tarball built or uploaded). This file is release-only: every job
# below fires ONLY when a human explicitly runs `workflow_dispatch` — never
# on an ordinary push or PR. See docs/VERIFICATION.md §5/§9 and
# docs/DISTRIBUTION.md §4.1 for the full before/after and the measured
# evidence behind the split.
#
# `fast` and `verify` are unchanged from what they always were: the same
# quality gates, running the same commands, with the same `needs` from
# `dry-run`/`publish` below. What changed is only WHEN they fire — as part of
# a deliberate release/dry-run request, re-proving the gate fresh rather than
# trusting a possibly-stale prior routine run, exactly as a release gate
# should.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "committed = publish the version already in the manifest; bump = compute a new one"
        required: true
        type: choice
        options: [committed, bump]
        default: committed
      release_type:
        description: "SemVer bump — used ONLY in bump mode, ignored in committed mode (see VERSIONING.md)"
        required: false
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: "Run every step but do not publish, tag, or release"
        required: false
        type: boolean
        default: true
concurrency:
  group: ds-release-${{ github.ref }}
  cancel-in-progress: false

# Minimum permissions: default everything to read-only, then grant write
# per-job, only where it is actually needed (see the `publish` job).
permissions:
  contents: read

jobs:
  # ── Release-time quality gate: Layer 1, fast (DS-1D; retriggered by CI-2) ──
  # Runs `npm run verify:fast` (tooling/verify.mjs) — app typecheck, test-tree
  # typecheck, ESLint, and the Vitest/jsdom component suite (DS-1C). All four
  # are fast, deterministic, and OS-independent, which is exactly why they're
  # grouped as one tier developers are expected to run constantly locally —
  # see docs/VERIFICATION.md. No Playwright here: its screenshot baselines
  # are OS-specific (see e2e/README.md; committed baselines are suffixed
  # `-darwin.png`, this runner is `ubuntu-latest`) — wiring it in without
  # Linux-generated baselines would fail every run for the wrong reason.
  # `npm run test:e2e` stays local-only until a Linux baseline set exists.
  #
  # CI-2: this job no longer runs on every push/PR — see this file's header
  # comment. It still runs the identical steps, now only as a prerequisite of
  # `dry-run`/`publish` below, re-proven fresh on every deliberate release
  # request. Routine push/PR coverage of this exact command now lives in
  # .github/workflows/validate.yml.
  fast:
    name: Verify (fast)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@studiopod"

      # Reads @studiopod/foundation from GitHub Packages (DS-7.5D). GitHub
      # Packages requires a token for EVERY install, including reads, so an
      # unauthenticated `npm ci` now fails with E401. DS_NPM_TOKEN is the
      # existing publish PAT; classic-PAT `write:packages` implies
      # `read:packages`, so one secret covers both directions. The repo's own
      # .npmrc carries scope routing only — no credential is committed.
      - name: Install (deterministic)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DS_NPM_TOKEN }}
        run: npm ci

      - name: verify:fast — typecheck, lint, unit tests
        run: npm run verify:fast

  # ── Release-time quality gate: Layer 2, package (DS-1D; retriggered by CI-2) ─
  # `npm run verify` HERE resolves against packages/design's OWN
  # package.json (see working-directory below) — a package-scoped build +
  # typecheck + API-baseline + CSS + use-client + exports check, identical to
  # its own `prepublishOnly` hook, so CI runs exactly the gate a publish
  # runs. This is a DIFFERENT script from the repo-root `npm run verify`
  # (tooling/verify.mjs) this same DS-1D phase introduces — root's `verify`
  # runs this job's fast tier PLUS the app build PLUS this package's verify
  # (via `npm run package:verify`, the unambiguous root-level bridge to this
  # exact script). Two scripts, same name, deliberately kept — see
  # docs/VERIFICATION.md "Two things named verify" for why that's fine.
  #
  # CI-2: this job no longer runs on every push/PR — see this file's header
  # comment. It still runs the identical steps (including the real
  # `npm pack --dry-run` and the real pack-and-upload below), now only as a
  # prerequisite of `dry-run`/`publish`, so a deliberate release still gets an
  # inspectable tarball artifact — the routine half of this job
  # (`npm run verify` only, no pack, no upload) now lives in
  # .github/workflows/validate.yml, which does not build or upload a tarball
  # on every commit (see that file's header comment for why: package-level
  # `verify`'s own `identity-check` step already performs a real pack and
  # export-resolution check, so nothing routine correctness needs was lost).
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout only — cannot tag, publish, or release
    defaults:
      run:
        working-directory: packages/design
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@studiopod"

      # Deterministic installs: `npm ci` fails if package-lock.json is out of
      # sync with package.json, which is the property we want in CI.
      #
      # Authenticated since DS-7.5D — see the note in the `fast` job.
      - name: Install (deterministic)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DS_NPM_TOKEN }}
        run: npm ci
        working-directory: .

      # build && typecheck && api-check && css-check && use-client-check &&
      # exports-check, all in one call — exports-check is already the last
      # step of this script, so there is deliberately no separate standalone
      # "verify exports" step after this one (an earlier revision ran
      # exports-check twice for exactly that reason).
      - name: Build, typecheck, API baseline, CSS, use-client, exports
        run: npm run verify

      # Proves the tarball contents are correct WITHOUT publishing.
      - name: Pack (dry run)
        run: npm pack --dry-run

      # `npm pack --pack-destination` does NOT create the directory; it exits
      # 254 (ENOENT) if it is missing. Hence the explicit mkdir.
      - name: Upload packed artifact for inspection
        run: |
          mkdir -p /tmp/ds-pack
          npm pack --pack-destination /tmp/ds-pack

      # No `continue-on-error` and no `if-no-files-found: ignore` here: both were
      # present originally and between them they masked a real ENOENT failure,
      # letting this job report green while packing nothing. A pack failure must
      # fail the job.
      - uses: actions/upload-artifact@v4
        with:
          name: design-tarball
          path: /tmp/ds-pack/*.tgz
          if-no-files-found: error

  # ── Dry run: exercise the release path, publish nothing ───────────────────
  # Phase C. Everything the real release does EXCEPT `npm publish`, the version
  # commit, and the tag push — so version calculation and the release commands
  # are proven before a credential is ever used.
  # ── Dry run: exercise the whole release path, change nothing ──────────────
  # DEFAULT MODE. Publishes nothing, tags nothing, releases nothing — enforced
  # by `permissions: contents: read` and by the absence of any publish step,
  # not merely by an `if:`.
  dry-run:
    name: Release dry run
    needs: [verify, fast]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    runs-on: ubuntu-latest
    permissions:
      contents: read   # cannot tag, publish, or release — enforced, not promised

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@studiopod"

      # Authenticated read of @studiopod/foundation — see the `fast` job note.
      - name: Install (deterministic)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DS_NPM_TOKEN }}
        run: npm ci

      # ── What are we proposing to publish? ─────────────────────────────────
      # `--release-type` is passed ONLY in bump mode. In committed mode the
      # resolver REJECTS a release type rather than ignoring it, so the empty
      # string here is load-bearing: it is what keeps "pre-set version plus
      # automatic bump" from silently resolving to a bump.
      - name: Resolve release target
        id: target
        run: |
          node tooling/release/resolve-target.mjs \
            --mode "${{ inputs.mode }}" \
            --release-type "${{ inputs.mode == 'bump' && inputs.release_type || '' }}"

      - name: Credential preflight (diagnosis only — nothing is published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DS_NPM_TOKEN }}
        run: node tooling/release/preflight-credential.mjs

      - name: Report + enforce distribution configuration
        env:
          DS_REGISTRY: ${{ vars.DS_REGISTRY }}
        run: |
          echo "DS_REGISTRY    set: $([ -n "$DS_REGISTRY" ] && echo yes || echo "NOT SET")   value: ${DS_REGISTRY:-<unset>}"
          echo "package name      : $(node -p "require('./packages/design/package.json').name")"
          echo "publishConfig     : $(node -p "require('./packages/design/package.json').publishConfig.registry")"
          echo "private           : $(node -p "require('./packages/design/package.json').private ?? false")"
          if [ -z "$DS_REGISTRY" ]; then
            echo "::error title=DS_REGISTRY not set::Add repository VARIABLE DS_REGISTRY = https://npm.pkg.github.com (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          elif [ "$DS_REGISTRY" != "https://npm.pkg.github.com" ]; then
            echo "::error title=DS_REGISTRY unexpected::Expected https://npm.pkg.github.com, got '$DS_REGISTRY'."
            exit 1
          fi

      # Full gate: build + typecheck + api + css + use-client + exports + identity.
      - name: Full verification pipeline
        working-directory: packages/design
        run: npm run verify

      # Committed mode must not have touched a tracked file. This is the
      # machine check behind "makes no manifest or lockfile mutation" — the
      # resolver only reads, and this proves nothing else wrote either.
      - name: Reject a dirty tree (committed mode)
        if: inputs.mode == 'committed'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Dirty tree::committed mode requires a clean tree; generated output is stale or a step mutated the manifest."
            git status --porcelain
            exit 1
          fi
          echo "OK — tree clean; no manifest or lockfile mutation."

      - name: Pack the real tarball
        working-directory: packages/design
        run: |
          mkdir -p /tmp/ds-pack
          npm pack --pack-destination /tmp/ds-pack

      # The version assertion is delegated to check-dry-run-artifact.mjs rather
      # than compared inline (DS-7.5D.1). This job never applies the version
      # bump, so the tarball always carries the COMMITTED version; the old
      # inline `test "$VER" = <target>` compared it against the BUMPED target
      # and so could not pass in bump mode, for any release type. The script
      # asserts the artifact against what was actually packed and the target
      # against the mode's arithmetic — two separate claims, both still checked.
      - name: Inspect the packed manifest
        run: |
          cd /tmp/ds-pack && tar -xzf ./*.tgz
          echo "--- files that would ship ---"; find package -type f | sort
          NAME=$(node -p "require('/tmp/ds-pack/package/package.json').name")
          VER=$(node -p "require('/tmp/ds-pack/package/package.json').version")
          echo "packed name    : $NAME"
          echo "packed version : $VER"
          test "$NAME" = "${{ steps.target.outputs.name }}"    || { echo "::error::packed name != resolved target"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          node tooling/release/check-dry-run-artifact.mjs \
            --mode "${{ inputs.mode }}" \
            --release-type "${{ inputs.mode == 'bump' && inputs.release_type || '' }}" \
            --packed "$VER" \
            --current "${{ steps.target.outputs.current-version }}" \
            --target "${{ steps.target.outputs.version }}"
          cd /tmp/ds-pack
          # DH-3 inverted this assertion. It used to require index.js to BEGIN
          # with "use client", because the bundled build stripped per-module
          # directives and re-injected one per entry — which is defect N1: a
          # directive on index.js makes every export in the package a client
          # reference, pure functions included. The package now emits one module
          # per source file, each carrying its own directive, so an entry point
          # is a re-export graph and must stay server-safe.
          #
          # The package's own scripts/check-client-boundaries.mjs is the
          # authority and checks all 538 modules; this asserts the one property
          # that matters about what actually shipped.
          head -c 13 package/dist/index.js | grep -q '"use client"' \
            && { echo "::error::published index.js carries \"use client\" — that is defect N1; entry points must be server-safe"; exit 1; } \
            || echo "OK   index.js is server-safe (no directive)"
          grep -rlq '^"use client"' package/dist/components/overlay/Dialog.js \
            && echo "OK   client modules retain their own directives" \
            || { echo "::error::client modules lost their \"use client\" directives"; exit 1; }
          grep -q "@theme" package/dist/styles.css \
            && echo "OK   styles.css retains @theme" \
            || { echo "::error::published styles.css is MISSING its @theme block"; exit 1; }
          for f in index tokens marketing illustrations; do
            test -s "package/dist/$f.js"   || { echo "::error::missing dist/$f.js";   exit 1; }
            test -s "package/dist/$f.d.ts" || { echo "::error::missing dist/$f.d.ts"; exit 1; }
          done
          echo "OK   all export targets present in the tarball"

      # Would the real publish be rejected? Ask now, while it is free.
      - name: Registry existence check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DS_NPM_TOKEN }}
          DS_REGISTRY: ${{ vars.DS_REGISTRY }}
        run: |
          node tooling/release/check-registry.mjs \
            --name "${{ steps.target.outputs.name }}" \
            --version "${{ steps.target.outputs.version }}"

      - name: Tag existence check
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error title=Tag already exists::$TAG is already on origin."
            exit 1
          fi
          echo "OK — tag $TAG is unused."

      - uses: actions/upload-artifact@v4
        with:
          name: design-dryrun-tarball
          path: /tmp/ds-pack/*.tgz
          if-no-files-found: error

      - name: Summary — exactly what a real run would do
        run: |
          echo "── DRY RUN — nothing was published, tagged, or released ──"
          echo "  package      : ${{ steps.target.outputs.name }}"
          echo "  version      : ${{ steps.target.outputs.version }}"
          echo "  registry     : ${{ vars.DS_REGISTRY }}"
          echo "  tag          : ${{ steps.target.outputs.tag }}"
          echo "  release mode : ${{ inputs.mode }}"
          echo "  mutates manifest: ${{ steps.target.outputs.will-mutate-manifest }}"
          echo ""
          echo "  committed version : ${{ steps.target.outputs.current-version }}"
          echo "  uploaded tarball  : carries the COMMITTED version, not the target."
          echo "                      This job never applies the bump, so in bump"
          echo "                      mode the artifact is a build of ${{ steps.target.outputs.current-version }};"
          echo "                      a real release differs only in the manifest"
          echo "                      version field. Do not treat it as a"
          echo "                      ${{ steps.target.outputs.version }} tarball."

  # ── Publish: transactional ordering ───────────────────────────────────────
  # validate -> build -> pack -> confirm unused -> PUBLISH -> verify from a
  # clean external consumer -> tag -> release.
  #
  # The tag is created LAST, and only after the published artifact has been
  # installed and verified from outside this repository. The previous revision
  # committed, tagged and PUSHED before `npm publish` ran, so a publish failure
  # left an orphan tag and a version-bump commit on main — a state that had to
  # be cleaned up by hand. Registry publication itself cannot be rolled back or
  # reused: a published name@version is permanent even after `npm unpublish`.
  publish:
    name: Publish
    needs: [verify, fast]
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write   # version commit (bump mode), tag, GitHub release
      packages: write   # publish to GitHub Packages

    steps:
      - name: Gate — is distribution configured?
        env:
          DS_REGISTRY: ${{ vars.DS_REGISTRY }}
        run: |
          [ -n "$DS_REGISTRY" ] || { echo "::error title=DS_REGISTRY not set::Set the DS_REGISTRY variable to https://npm.pkg.github.com. See docs/DISTRIBUTION.md §7."; exit 1; }
          echo "Distribution registry configured."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: ${{ vars.DS_REGISTRY }}
          scope: "@studiopod"

      # Authenticated read of @studiopod/foundation — see the `fast` job note.
      - name: Install (deterministic)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DS_NPM_TOKEN }}
        run: npm ci

      # ── 1. VALIDATE ───────────────────────────────────────────────────────
      - name: Credential preflight
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DS_NPM_TOKEN }}
        run: node tooling/release/preflight-credential.mjs

      - name: Resolve release target
        id: target
        run: |
          node tooling/release/resolve-target.mjs \
            --mode "${{ inputs.mode }}" \
            --release-type "${{ inputs.mode == 'bump' && inputs.release_type || '' }}"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # bump mode only: write the new version now so it is what gets built,
      # packed and published. NOT committed yet — the commit and tag happen
      # after a verified publish.
      - name: Apply version bump (bump mode only)
        if: steps.target.outputs.will-mutate-manifest == 'true'
        working-directory: packages/design
        run: |
          npm version "${{ inputs.release_type }}" --no-git-tag-version --allow-same-version >/dev/null
          APPLIED=$(node -p "require('./package.json').version")
          test "$APPLIED" = "${{ steps.target.outputs.version }}" \
            || { echo "::error::npm version produced $APPLIED, expected ${{ steps.target.outputs.version }}"; exit 1; }
          echo "manifest set to $APPLIED"

      - name: Reject a dirty tree (committed mode)
        if: inputs.mode == 'committed'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Dirty tree::committed mode must not mutate the manifest or lockfile."
            git status --porcelain
            exit 1
          fi
          echo "OK — tree clean."

      # ── 2. BUILD (+ every gate) ───────────────────────────────────────────
      - name: Full verification pipeline
        working-directory: packages/design
        run: npm run verify

      # ── 3. PACK ───────────────────────────────────────────────────────────
      - name: Pack
        working-directory: packages/design
        run: |
          mkdir -p /tmp/ds-pack
          npm pack --pack-destination /tmp/ds-pack
          NAME=$(node -p "require('./package.json').name")
          test "$NAME" = "${{ steps.target.outputs.name }}" || { echo "::error::packed name != target"; exit 1; }

      # ── 4. CONFIRM THE COORDINATE IS UNUSED ───────────────────────────────
      # Last free moment. Everything after this is irreversible.
      - name: Confirm target version is unused
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DS_NPM_TOKEN }}
          DS_REGISTRY: ${{ vars.DS_REGISTRY }}
        run: |
          node tooling/release/check-registry.mjs \
            --name "${{ steps.target.outputs.name }}" \
            --version "${{ steps.target.outputs.version }}"

      # ── 5. PUBLISH — IRREVERSIBLE ─────────────────────────────────────────
      # Auth is a PAT (secrets.DS_NPM_TOKEN), NOT GITHUB_TOKEN: the repo owner
      # (jheavner95, a User) differs from the package scope (@studiopod, an
      # org), and GITHUB_TOKEN's packages:write is scoped to the repo owner.
      # The token reaches ONLY this step.
      - name: Publish
        id: publish
        working-directory: packages/design
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DS_NPM_TOKEN }}
        run: npm publish

      # ── 6/7. VERIFY FROM A CLEAN EXTERNAL CONSUMER ────────────────────────
      # Installs the PUBLISHED artifact outside the workspace and checks
      # exports, types, CSS, and dist hashes against the local tarball. A
      # failure here stops the run before any tag exists.
      - name: Verify the published package from a clean consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DS_NPM_TOKEN }}
          DS_REGISTRY: ${{ vars.DS_REGISTRY }}
        run: |
          TARBALL=$(ls /tmp/ds-pack/*.tgz | head -1)
          node tooling/release/verify-published.mjs \
            --name "${{ steps.target.outputs.name }}" \
            --version "${{ steps.target.outputs.version }}" \
            --tarball "$TARBALL"

      # ── 8. TAG (only now) ─────────────────────────────────────────────────
      # Tag prefix stays `design-system-v`: it names this repository's release
      # series, not the npm package. 17 such tags already exist.
      - name: Commit version bump and tag
        run: |
          V="${{ steps.target.outputs.version }}"
          TAG="${{ steps.target.outputs.tag }}"
          if [ "${{ steps.target.outputs.will-mutate-manifest }}" = "true" ]; then
            git add packages/design/package.json package-lock.json
            git commit -m "release(design-system): v${V}"
          else
            echo "committed mode — version ${V} is already committed; tagging HEAD."
          fi
          git tag -a "$TAG" -m "@studiopod/design v${V}"
          git push origin HEAD --follow-tags

      # ── 9. GITHUB RELEASE ─────────────────────────────────────────────────
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.target.outputs.version }}"
          TAG="${{ steps.target.outputs.tag }}"
          gh release create "$TAG" \
            --title "@studiopod/design v${V}" \
            --generate-notes \
            --notes-file <(sed -n "/^## ${V}/,/^## /p" packages/design/CHANGELOG.md || echo "See CHANGELOG.md")
